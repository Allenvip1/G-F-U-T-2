    dates.map(d => `<tr><td>${d} ${wday(d)}</td><td>${cell(g, d)}</td><td>${reading(g.pChg.get(d), (g.tByDate.get(d) || {}).chg)}</td><td>${cell(v, d)}</td><td>${reading(v.pChg.get(d), (v.tByDate.get(d) || {}).chg)}</td></tr>`).join("") +
    `</tbody></table></div></div>`;
}
function legend(t) {
  METALS.forEach(m => {
    const rows = D[m.key].total; let r = null;
    if (t) { for (let i = rows.length - 1; i >= 0; i--) if (rows[i][0] <= t) { r = rows[i]; break; } }
    if (!r) r = rows[rows.length - 1];
    const p = m.pByDate.get(r[0]) || null;
    $("lg_" + m.key).innerHTML = `<span>日期 <b>${r[0]}</b></span><span>持仓量 <b>${fmt(r[2])}</b> 手</span><span>当日变化 <b>${sgn(r[3])}</b></span><span>成交量 <b>${fmt(r[1])}</b></span>` +
      (p ? `<span>日线 开 <b>${fmt(p[1], 2)}</b> 高 <b>${fmt(p[2], 2)}</b> 低 <b>${fmt(p[3], 2)}</b> 收 <b>${fmt(p[4], 2)}</b></span>` : "");
  });
}
function bind() {
  ALL.forEach(e => {
    e.el.style.position = "relative"; e.tip = document.createElement("div"); e.tip.className = "tip"; e.el.appendChild(e.tip);
    e.el.addEventListener("mouseenter", () => { HOVER = e; });
    e.el.addEventListener("mouseleave", () => { if (HOVER === e) HOVER = null; e.tip.style.display = "none"; });
    ["mouseenter", "mousedown", "touchstart", "wheel"].forEach(ev => e.el.addEventListener(ev, () => { ACTIVE = e; }, { passive: true }));
    e.chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (!r || ACTIVE !== e) return; ALL.forEach(o => { if (o !== e) o.chart.timeScale().setVisibleLogicalRange(r); }); });
    e.chart.subscribeCrosshairMove(p => {
      if (syncC) return; const t = p.time || null; if (HOVER && HOVER !== e) return;
      legend(t); showTip(e, p); syncC = true;
      ALL.forEach(o => { if (o === e) return; if (!t) { o.chart.clearCrosshairPosition(); return; } const v = o.get(t); if (v == null) o.chart.clearCrosshairPosition(); else o.chart.setCrosshairPosition(v, t, o.series); });
      syncC = false;
    });
  });
  document.querySelectorAll(".controls button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".controls button").forEach(x => x.classList.toggle("on", x === b)); setRange(+b.dataset.m);
  });
  addEventListener("resize", () => ALL.forEach(e => e.chart.applyOptions({ width: e.el.clientWidth })));
}
function setRange(months) {
  ACTIVE = null;
  const last = CAL[CAL.length - 1];
  let from = CAL[0];
  if (months) { const d = new Date(last + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - months); from = d.toISOString().slice(0, 10); }
  ALL.forEach(e => { try { e.chart.timeScale().setVisibleRange({ from, to: last }); } catch (x) { e.chart.timeScale().fitContent(); } });
}
if (!D) { $("meta").textContent = "没有数据：请先运行 scripts/build.py"; }
else {
  build(); setRange(0);
  const g = D.es.total;
  $("meta").innerHTML = `持仓量数据截至 <b>${g[g.length - 1][0]}</b>（CME 每日公报，收盘后发布）· 页面更新于 ${bjTime(D.updated)}`;
  $("note").innerHTML = `数据来源于 CME Group 公开日报，价格为 Yahoo Finance 日线，图表由 <a href="https://tradingview.com" target="_blank" rel="noopener" style="color:#6ea8fe">TradingView</a> Lightweight Charts™ 提供。<br>

}
</script>
